spring:
  application:
    name: campusreco
  datasource:
    url: jdbc:mysql://localhost:3306/campus_reco?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-local.sql
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 100ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

server:
  port: 8080

app:
  recommendation:
    profile-top-tag-limit: 5
    rerank-weight-scale: 1.0
  ai:
    explanation:
      enabled: true
    zhipu:
      base-url: https://open.bigmodel.cn/api/paas/v4
      api-key: ${ZAI_API_KEY:}
      model: glm-4-flash-250414
      temperature: 0.2
      max-tokens: 220
      timeout-ms: 20000
