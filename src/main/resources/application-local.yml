spring:
  datasource:
    url: jdbc:mysql://${LOCAL_MYSQL_HOST:localhost}:${LOCAL_MYSQL_PORT:3306}/${LOCAL_MYSQL_DB:campus_reco}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${LOCAL_MYSQL_USER:root}
    password: ${LOCAL_MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-local.sql
  data:
    redis:
      host: ${LOCAL_REDIS_HOST:localhost}
      port: ${LOCAL_REDIS_PORT:6379}
      database: ${LOCAL_REDIS_DB:0}
      timeout: ${LOCAL_REDIS_TIMEOUT:100ms}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
