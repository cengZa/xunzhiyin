spring:
  datasource:
    url: jdbc:h2:mem:campusreco;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-integration.sql
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 100ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

app:
  generated-docs-dir: target/generated-docs
